<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ETP · Painel Pedagógico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="gate" id="gate">
  <div class="gate-box">
    <img src="logo.png" alt="Idealiza">
    <h2>Acesso ao Painel</h2>
    <p>Digite a senha para entrar</p>
    <input id="gateUser" type="text" placeholder="Seu nome" list="userlist" autocomplete="off">
    <datalist id="userlist"></datalist>
    <input id="gatePass" type="password" placeholder="Senha">
    <button class="gate-btn" id="gateBtn">Entrar</button>
    <div class="gate-err" id="gateErr"></div>
  </div>
</div>

<div class="modal-overlay" id="profileModal">
  <div class="modal-box">
    <h2>Meu perfil</h2>
    <div class="modal-avatar" id="modalAvatar"></div>
    <label class="file-btn" for="photoInput">Alterar foto</label>
    <input type="file" id="photoInput" accept="image/*" style="display:none;">
    <label class="field-label">Nova senha</label>
    <input type="password" id="newPass1" placeholder="Digite a nova senha">
    <label class="field-label">Confirmar nova senha</label>
    <input type="password" id="newPass2" placeholder="Repita a nova senha">
    <div class="modal-actions">
      <button class="modal-btn cancel" id="profileCancel">Fechar</button>
      <button class="modal-btn save" id="profileSave">Salvar</button>
    </div>
    <div class="modal-msg" id="profileMsg"></div>
  </div>
</div>

<div class="hero">
  <div class="hero-actions">
    <div class="userchip" id="userChip" style="display:none;">
      <div class="av" id="userAv"></div><span id="userLabel"></span>
    </div>
    <button class="logout" id="logoutBtn" style="display:none;">Sair</button>
  </div>
  <div class="brandrow">
    <div class="logo"><img src="logo.png" alt="Idealiza"></div>
  </div>
  <h1>Painel de Acompanhamento Pedagógico</h1>
  <p>Escola Técnica e Profissionalizante · Andamento dos alunos por turma, turno e módulo</p>
</div>

<div class="stats">
  <div class="stat"><b id="st-total">0</b><span>Alunos</span></div>
  <div class="stat adv"><b id="st-adv">0</b><span>Adiantados</span></div>
  <div class="stat ok"><b id="st-ok">0</b><span>Em dia</span></div>
  <div class="stat late"><b id="st-late">0</b><span>Atrasados</span></div>
  <div class="stat miss"><b id="st-miss">0</b><span>Faltantes</span></div>
</div>

<div class="wrap">
  <div class="searchbar"><input id="search" type="text" placeholder="Buscar aluno pelo nome..."></div>
  <div class="filters" id="filters"></div>
  <div class="tabs" id="tabs"></div>
  <div id="content"></div>
  <div class="savebar">
    <button class="savebtn" id="saveBtn">Salvar alterações</button>
    <div class="savemsg" id="saveMsg"></div>
  </div>
</div>
